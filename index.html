<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Croc ER Meter</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --panel: #111;
      --text: #fff;
      --border: #444;
      --lime: #7CFF00;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      font-family: 'Space Grotesk', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Grain behind content */
    body > * { position: relative; z-index: 1; }

    /* Inputs */
    .input-area { margin-bottom: 30px; }

    input, button, select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-family: 'Space Grotesk', Arial, sans-serif;
    }

    select { margin-right: 10px; cursor: pointer; }

    button {
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input::placeholder { color: #aaa; }

    input:disabled, button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Meter layout */
    .meter-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .meter-wrapper {
  position: relative; /* THIS is the anchor */
  display: inline-block;
}


    /* KEY FIX: wrapper shrink-wraps to the dial image box */
    .dial-wrap {
      position: relative;
      display: inline-block; /* makes the wrapper match image size */
      line-height: 0;        /* prevents tiny gaps */
    }

    .meter-bg {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 70vh;
      display: block;

      border: 4px solid var(--lime);
      border-radius: 12px;

      box-shadow:
        0 0 12px rgba(124, 255, 0, 0.8),
        0 0 30px rgba(124, 255, 0, 0.6),
        0 0 60px rgba(124, 255, 0, 0.35),
        0 0 90px rgba(124, 255, 0, 0.2);
    }

    /* Needle pivot + needle */
    .needle-pivot {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .needle {
      position: absolute;
      width: 320px;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%) rotate(-90deg);
      transform-origin: 50% 92%;
      transition: transform 0.8s ease;
      pointer-events: none;
    }

    /* Vibes image button (anchored to dial box) */
   .vibes-btn {
  position: absolute;
  top: -18px;     /* pulls it slightly into the green glow */
  left: -18px;    /* hugs the corner like a sticker */
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  z-index: 10;
}


    .vibes-btn img {
      width: 240px;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55));
      transition: transform 0.15s ease, filter 0.15s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .vibes-btn:hover img {
      transform: scale(1.05);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.75));
    }

    .vibes-btn:active img {
      transform: scale(0.95);
    }

    /* Optional: when playing, add a glow */
    .vibes-btn.playing img {
      filter:
        drop-shadow(0 0 10px rgba(124, 255, 0, 0.55))
        drop-shadow(0 8px 12px rgba(0,0,0,0.6));
    }

    /* Result */
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #result.show { opacity: 1; }

    .microcopy {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.75;
      font-weight: 400;
    }

    /* Film grain overlay */
    body::before {
      content: "";
      position: fixed;
      inset: -25%;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: screen;
      opacity: 0.55;
      background-size: 70px 70px;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35) 0.6px, transparent 0.7px),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,0.30) 0.6px, transparent 0.7px),
        radial-gradient(circle at 40% 65%, rgba(255,255,255,0.25) 0.6px, transparent 0.7px),
        radial-gradient(circle at 80% 75%, rgba(255,255,255,0.20) 0.6px, transparent 0.7px),
        radial-gradient(circle at 25% 85%, rgba(255,255,255,0.22) 0.6px, transparent 0.7px);
      animation: grain 1.8s steps(6) infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-1%, -1%); }
      20% { transform: translate(1%, 1%); }
      30% { transform: translate(-2%, 1%); }
      40% { transform: translate(2%, -1%); }
      50% { transform: translate(-1%, 2%); }
      60% { transform: translate(1%, -2%); }
      70% { transform: translate(-2%, -1%); }
      80% { transform: translate(1%, 1%); }
      90% { transform: translate(-1%, -2%); }
    }

    /* Jibbit rain */
    #jibbitRain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .jibbit {
      position: absolute;
      top: -80px;
      will-change: transform, opacity;
      opacity: 0.95;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.45));
      animation: jibbitFall linear forwards;
    }

    @keyframes jibbitFall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.95; }
      100% { transform: translate3d(var(--drift, 0px), 120vh, 0) rotate(var(--spin, 0deg)); opacity: 0.95; }
    }

    @media (prefers-reduced-motion: reduce) {
      .jibbit { animation: none; }
      body::before { animation: none; }
    }
  </style>
</head>

<body>
  <h1>Enter ER %</h1>

  <div class="input-area">
    <select id="channelSelect">
  <option value="" selected disabled>Select a channel</option>
  <option value="instagram">Instagram</option>
  <option value="tiktok">TikTok</option>
  <option value="facebook">Facebook</option>
  <option value="x">X (Twitter)</option>
  <option value="youtube">YouTube</option>
</select>


    <input id="viewsInput" type="number" step="1" placeholder="Views" disabled />
<input id="engInput" type="number" step="1" placeholder="Engagements" disabled />
<input id="sharesInput" type="number" step="1" placeholder="Shares (optional)" disabled />
<input id="erInput" type="number" step="0.1" placeholder="ER% (optional)" disabled />

    <button id="checkBtn" type="button" disabled>Gauge It</button>
  </div>

  <div class="meter-container">
  <div class="meter-wrapper">
    <button class="vibes-btn" id="vibesBtn" aria-label="Play vibes">
      <img src="vibes.png" alt="Vibes">
    </button>

    <img src="meter-bg.png" class="meter-bg" alt="Croc ER meter" />

    <div class="needle-pivot">
      <img src="needle-croc.png" class="needle" id="needle" alt="Needle" />
    </div>
  </div>
</div>


  <div id="result"></div>
  <div id="jibbitRain" aria-hidden="true"></div>

  <audio id="vibesAudio" preload="auto">
    <source src="vibes.mp3" type="audio/mpeg">
  </audio>

  <script>
    const viewsInput = document.getElementById("viewsInput");
const engInput = document.getElementById("engInput");
const sharesInput = document.getElementById("sharesInput");
const erInput = document.getElementById("erInput");

    const channelSelect = document.getElementById("channelSelect");
    const checkBtn = document.getElementById("checkBtn");
    const result = document.getElementById("result");
    const needle = document.getElementById("needle");

    const vibesBtn = document.getElementById("vibesBtn");
    const vibesAudio = document.getElementById("vibesAudio");

    function hasAtLeastOneMetric() {
  const views = document.getElementById("viewsInput")?.value;
  const eng   = document.getElementById("engInput")?.value;
  const er    = document.getElementById("erInput")?.value;

  function tierVsAvg(value, avg, low = 0.8, high = 1.2) {
  if (!Number.isFinite(value) || !Number.isFinite(avg) || avg <= 0) return null;
  const ratio = value / avg;
  if (ratio < low) return "below";
  if (ratio > high) return "above";
  return "onpar";
}


  return (
    (views && Number(views) > 0) ||
    (eng && Number(eng) > 0) ||
    (er && Number(er) > 0)
  );
}


    // --- VIBES logic ---
    let vibesTimer = null;
    let isVibing = false;

    function stopVibes() {
      if (vibesTimer) {
        clearTimeout(vibesTimer);
        vibesTimer = null;
      }
      vibesAudio.pause();
      vibesAudio.currentTime = 0;
      isVibing = false;
      vibesBtn.classList.remove("playing");
    }

    function startVibes() {
      vibesAudio.currentTime = 0;

      vibesAudio.play().then(() => {
        isVibing = true;
        vibesBtn.classList.add("playing");

        vibesTimer = setTimeout(() => {
          stopVibes();
        }, 20000);
      }).catch(() => {
        // Autoplay restrictions happen sometimes; this keeps UI stable
        isVibing = false;
        vibesBtn.classList.remove("playing");
        alert("Tap VIBES again to allow audio playback.");
      });
    }

    // ✅ THIS WAS MISSING IN YOUR VERSION:
    vibesBtn.addEventListener("click", () => {
      if (isVibing) stopVibes();
      else startVibes();
    });
    // Views and Engagement Benchmarks
const BENCHMARKS = {
  instagram: { viewsAvg: 5000, engAvg: 800, erGoal: 16.0 },
  x:         { viewsAvg: 2000, engAvg: 300, erGoal: 15.0 },
  tiktok:    { viewsAvg: 7000, engAvg: 900, erGoal: 12.86 },
  youtube:   { viewsAvg: 7500, engAvg: 250, erGoal: 3.33 },
  facebook:  { viewsAvg: 5500, engAvg: 600, erGoal: 10.91 }
};

    // --- ER thresholds ---
    /*
    const thresholds = {
  instagram: [2, 4, BENCHMARKS.instagram.erGoal],
  tiktok: [4, 7, 10],
  facebook: [1, 2.5, 4],
  x: [0.5, 1.5, 3],
  youtube: [1, 2.5, 4] // placeholder for now — you said YouTube ER calc is “later”
};
*/

    const thresholds = {
  instagram: [2, 4, 6],
  tiktok: [4, 7, 10],
  facebook: [1, 2.5, 4],
  x: [0.5, 1.5, 3],
  youtube: [1, 2.5, 4] // placeholder for now — you said YouTube ER calc is “later”
};



    // Enable inputs only after channel selection
    erInput.disabled = true;
    checkBtn.disabled = true;

    channelSelect.addEventListener("change", () => {
  const hasChannel = channelSelect.value !== "";

  // enable all inputs when channel is selected
  viewsInput.disabled = !hasChannel;
  engInput.disabled = !hasChannel;
  sharesInput.disabled = !hasChannel;
  erInput.disabled = !hasChannel;

  // reset
  viewsInput.value = "";
  engInput.value = "";
  sharesInput.value = "";
  erInput.value = "";
  checkBtn.disabled = true;

  result.textContent = "";
  result.classList.remove("show");

  if (hasChannel) viewsInput.focus();
});


    erInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !checkBtn.disabled) updateMeter();
    });

    checkBtn.addEventListener("click", updateMeter);

    // --- Jibbit rain ---
    let jibbitInterval = null;

    function startJibbitRain(durationMs = 2200) {
      const rain = document.getElementById("jibbitRain");
      if (!rain) return;

      stopJibbitRain();
      const start = Date.now();

      jibbitInterval = setInterval(() => {
        if (Date.now() - start > durationMs) {
          stopJibbitRain();
          return;
        }

        const count = Math.floor(Math.random() * 3) + 2; // 2–4
        for (let i = 0; i < count; i++) {
          const img = document.createElement("img");
          img.src = "jibbit.png";
          img.className = "jibbit";

          const size = Math.floor(Math.random() * 100) + 70; // 70–170px
          img.style.width = `${size}px`;
          img.style.height = "auto";

          img.style.left = `${Math.random() * 100}vw`;

          const drift = (Math.random() * 120 - 60).toFixed(0);
          const spin = (Math.random() * 360 - 180).toFixed(0);
          img.style.setProperty("--drift", `${drift}px`);
          img.style.setProperty("--spin", `${spin}deg`);

          const fallDuration = (Math.random() * 1.2 + 1.6).toFixed(2);
          img.style.animationDuration = `${fallDuration}s`;

          img.addEventListener("animationend", () => img.remove());
          rain.appendChild(img);
        }
      }, 180);
    }

    function stopJibbitRain() {
      if (jibbitInterval) {
        clearInterval(jibbitInterval);
        jibbitInterval = null;
      }
      const rain = document.getElementById("jibbitRain");
      if (rain) rain.innerHTML = "";
    }

    // --- Main meter update ---
   function updateMeter() {
  const channel = channelSelect.value;
  if (!channel) {
    alert("Please select a channel first");
    return;
  }

  const bm = BENCHMARKS[channel];
  if (!bm) {
    alert("No benchmarks found for this channel.");
    return;
  }

  const views = viewsInput.value ? parseFloat(viewsInput.value) : null;
  const eng = engInput.value ? parseFloat(engInput.value) : null;
  const shares = sharesInput.value ? parseFloat(sharesInput.value) : null;

  // ER can be user-provided OR calculated
  const erProvided = erInput.value ? parseFloat(erInput.value) : null;

  let er = null;
  let erSource = "none";

  if (Number.isFinite(erProvided)) {
    er = erProvided;
    erSource = "provided";
  } else if (Number.isFinite(views) && views > 0 && Number.isFinite(eng)) {
    er = (eng / views) * 100;
    erSource = "calculated";
  }

  // Decide what we can evaluate
  const hasViews = Number.isFinite(views) && views >= 0;
  const hasEng = Number.isFinite(eng) && eng >= 0;
  const hasER = Number.isFinite(er);

  const viewsTier = hasViews ? tierVsAvg(views, bm.viewsAvg) : null; // below | onpar | above
const engTier   = hasEng ? tierVsAvg(eng, bm.engAvg) : null;
  const erVs = hasER ? (er >= bm.erGoal ? "above" : "below") : null; // goal check


  // Reset effects
  stopJibbitRain();
  result.classList.remove("show");

  // Needle behavior:
  // - Only move needle if we have ER (provided or calculated)
  // - Otherwise keep it parked at -90
  let angle = -90;

  if (hasER) {
    const [badMax, goodMax, betterMax] = thresholds[channel];
    if (er < badMax) angle = -90;
    else if (er < goodMax) angle = -30;
    else if (er < betterMax) angle = 30;
    else angle = 90;

    needle.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
  } else {
    needle.style.transform = `translate(-50%, -50%) rotate(-90deg)`;
  }

  // Build insight (your rule set)
  let label = "";
  let microCopy = "";
  let detailLine = "";

  // Case A: Views + Engagements present (best insight power)
  if (hasViews && hasEng) {
    // rule 1: views above benchmark but engagements below benchmark
    if (viewsTier === "above" && engTier === "below") {
  label = "Hook landed. Bite didn’t.";
  microCopy = "Views popped but engagement lagged. What got the click and what didn’t earn the action?";
}

    // opposite: views below but engagements above
    else if (viewsVs === "below" && engVs === "above") {
      label = "Small crowd, big feelings.";
      microCopy = "Engagement is strong for the reach you got — worth testing new distribution or opening frames.";
    }
    // both above
    else if (viewsTier === "above" && engTier === "above") {
  label = "Certified snapper.";
  microCopy = "Above-average views *and* engagement. Bottle the strategy.";
}

    // both below
    else {
  label = "Quiet waters.";
  microCopy = "Below average views + engagement. Worth revisiting hook, format, or who this is for.";
}


    // Optional: show calculated ER info if relevant
    if (hasER) {
      detailLine =
        erSource === "calculated"
          ? `Calculated ER: ${er.toFixed(2)}% (goal: ${bm.erGoal}%)`
          : `ER: ${er.toFixed(2)}% (goal: ${bm.erGoal}%)`;
    }
  }

  // Case B: Only Engagements
  else if (hasEng && !hasViews && !hasER) {
    label = engVs === "above" ? "People showed up." : "A lil under.";
    microCopy =
      engVs === "above"
        ? "Engagement is above benchmark — something’s resonating. What’s the repeatable ingredient?"
        : "Engagement is under benchmark — what might be missing: clarity, payoff, or reason to comment/save?";
    detailLine = `Engagement benchmark: ${bm.engAvg}`;
  }

  // Case C: Only Views
  else if (hasViews && !hasEng && !hasER) {
    label = viewsVs === "above" ? "Hook did its job." : "Not grabbing yet.";
    microCopy =
      viewsVs === "above"
        ? "Views are above benchmark — your hook/packaging is working. Next: add a stronger “why engage” moment."
        : "Views are under benchmark — hook, thumbnail, first 1–2 seconds, or targeting might need a tweak.";
    detailLine = `Views benchmark: ${bm.viewsAvg}`;
  }

  // Case D: ER provided (or ER calculable without both? usually needs both)
  else if (hasER) {
    label = erVs === "above" ? "Above goal 🐊" : "Under goal 🥴";
    microCopy =
      erVs === "above"
        ? "ER is above goal — this is performing with intent. What about it is *share/save worthy*?"
        : "ER is under goal — something didn’t convert attention into action. Where’s the drop-off happening?";
    detailLine = `Goal ER: ${bm.erGoal}%`;
  }

  else {
    alert("Enter at least one metric (Views, Engagements, Shares, or ER%).");
    return;
  }

  // Shares add-on (optional, heuristic)
  if (Number.isFinite(shares) && shares > 0) {
    if (Number.isFinite(eng) && eng > 0) {
      const shareShare = shares / eng; // shares as fraction of engagements
      if (shareShare >= 0.25) {
        microCopy += " Shares are doing work here — feels like *resonance* or “send-to-a-friend” energy.";
      }
    } else if (Number.isFinite(views) && views > 0) {
      const shareRate = shares / views;
      if (shareRate >= 0.01) {
        microCopy += " Shares look strong vs views — people might be passing this around for a reason.";
      }
    }
  }

  // If Above Goal ER → jibbit rain
  if (hasER && erVs === "above") startJibbitRain(2600);

  // Human channel label
  const channelLabel = channelSelect.options[channelSelect.selectedIndex].text;

  // Delayed reveal
  setTimeout(() => {
    result.innerHTML = `
      <div>${channelLabel} — ${label}</div>
      <div class="microcopy">${microCopy}</div>
      ${detailLine ? `<div class="microcopy" style="opacity:0.55">${detailLine}</div>` : ""}
    `;
    result.classList.add("show");
  }, 500);
}


      stopJibbitRain();

      const [badMax, goodMax, betterMax] = thresholds[channel];

      let angle = -90;
      let label = "Close but no 🥴";
      let microCopy = "Oof. This croc stayed dormant.";

      if (er < badMax) {
        angle = -90;
        label = "Close but no 🥴";
        microCopy = "Oof. This croc stayed dormant.";
      } else if (er < goodMax) {
        angle = -30;
        label = "Good 👍";
        microCopy = "A solid splash.";
      } else if (er < betterMax) {
        angle = 30;
        label = "Better 🔥";
        microCopy = "Now we’re really snapping.";
      } else {
        angle = 90;
        label = "Killin’ It 🐊";
        microCopy = "Big bite energy.";
        startJibbitRain(2600);
      }

      needle.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

      const channelLabel = channelSelect.options[channelSelect.selectedIndex].text;

      result.classList.remove("show");
      setTimeout(() => {
        result.innerHTML = `
          <div>${channelLabel} ER ${er}% — ${label}</div>
          <div class="microcopy">${microCopy}</div>
        `;
        result.classList.add("show");
      }, 500);
    }
  </script>
</body>
</html>
