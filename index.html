<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Croc ER Meter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f7f7f7;
    }

    .meter-container {
      position: relative;
      width: 300px;
      margin: 40px auto;
    }

    .meter-bg {
      width: 100%;
    }

    .needle {
  position: absolute;
  width: 220px;             /* adjust if needed */
  left: 50%;
  top: 65%;                 /* anchor around the dial center area */
  transform-origin: 12% 50%; /* pivot closer to the left */
  transform: translate(-50%, -50%) rotate(-90deg);
  transition: transform 0.8s ease;
}


    input {
      padding: 10px;
      font-size: 16px;
      width: 100px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .full-bleed {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
}

/* This becomes the "window" the image sits in */
.meter-container {
  position: relative;
  width: 100%;
  height: min(52vw, 420px); /* controls how tall it gets */
  overflow: hidden;         /* crops it cleanly */
}

/* Make the image fill the window without stretching weirdly */
.meter-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;        /* fills + crops */
  display: block;
}


  </style>
</head>

<body>
  <h1>Enter ER %</h1>

  <input id="erInput" type="number" step="0.1" placeholder="e.g. 3.5" />
  <button onclick="updateMeter()">Check</button>

  <div class="full-bleed">
  <div class="meter-container">
    <img src="meter-bg.png" class="meter-bg" />
    <img src="needle-croc.png" class="needle" id="needle" />
  </div>
</div>


  <div id="result"></div>

  <script>
    function updateMeter() {
      const er = parseFloat(document.getElementById("erInput").value);
      const needle = document.getElementById("needle");
      const result = document.getElementById("result");

      if (isNaN(er)) {
        alert("Please enter a number");
        return;
      }

      let angle = -90;
      let label = "Bad";

      if (er < 2) {
        angle = -90;
        label = "Bad 🥴";
      } else if (er < 4) {
        angle = -30;
        label = "Good 👍";
      } else if (er < 6) {
        angle = 30;
        label = "Better 😎";
      } else {
        angle = 90;
        label = "Above Goal 🐊🔥";
      }

     needle.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

      result.textContent = `ER ${er}% — ${label}`;
    }
  </script>
</body>
</html>
