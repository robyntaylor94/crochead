<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Croc ER Meter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
   body {
  margin: 0;
  font-family: 'Space Grotesk', Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;
  background: #000;
  color: #fff;
} 
.input-area {
  margin-bottom: 30px; /* increase if you want more space */
}





    /* This is the fixed pivot point (center of the dial) */
/* Fixed pivot point (dial center) */
.needle-pivot {
  position: absolute;
  left: 50%;
  top: 55%;         /* <-- adjust this up/down until the circle sits on dial center */
  width: 0;
  height: 0;
}

/* Needle image rotates around the spiky circle center */
.needle {
  position: absolute;
  width: 320px;     /* tweak size */
  left: 0;
  top: 0;

  /* These two are the KEY:
     Put the spiky-circle center on the pivot point */
  transform: translate(-50%, -50%) rotate(-90deg);

  /* Set origin to the circle center INSIDE the image */
  transform-origin: 50% 92%;  /* <-- tweak this to match the circle's center */

  transition: transform 0.8s ease;
  pointer-events: none;
}




    input {
      padding: 10px;
      font-size: 16px;
      width: 100px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif; /* match h1 */
  letter-spacing: 0.06em;
  text-transform: uppercase;
}


    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    

input, button {
  background: #111;
  color: #fff;
  border: 1px solid #444;

  padding: 12px 18px;
  border-radius: 12px;   /* ← this rounds them */
  font-size: 16px;
}

input::placeholder {
  color: #aaa;
}


.meter-container {
  position: relative;
  width: 100%;
  margin: 0 auto;
  display: flex;
  justify-content: center;
}


.meter-bg {
  width: auto;          /* don't force it wider than its natural size */
  height: auto;         /* keep aspect ratio */
  max-width: 100%;      /* still responsive on small screens */
  max-height: 70vh;     /* keep it from taking over vertically */
  display: block;
  image-rendering: auto;
  border: 4px solid #7CFF00;   /* lime green */
  border-radius: 12px;         /* optional: slight rounding */
 
  box-shadow:
  0 0 12px rgba(124, 255, 0, 0.8),
  0 0 30px rgba(124, 255, 0, 0.6),
  0 0 60px rgba(124, 255, 0, 0.35),
  0 0 90px rgba(124, 255, 0, 0.2);

}
/* Grain overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0.08) 1px,
      rgba(0,0,0,0.08) 1px,
      rgba(0,0,0,0.08) 2px
    );

  opacity: 0.35;                 /* grain strength */
  mix-blend-mode: overlay;       /* makes grain visible on black */
  pointer-events: none;
  z-index: 0;

  animation: grain 8s steps(10) infinite;
}

body > * {
  position: relative;
  z-index: 1;
}

@keyframes grain {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(-1%, -1%); }
  20% { transform: translate(1%, 1%); }
  30% { transform: translate(-2%, 1%); }
  40% { transform: translate(2%, -1%); }
  50% { transform: translate(-1%, 2%); }
  60% { transform: translate(1%, -2%); }
  70% { transform: translate(-2%, -1%); }
  80% { transform: translate(1%, 1%); }
  90% { transform: translate(-1%, -2%); }
}



  </style>
</head>

<body>
  <h1>Enter ER %</h1>

<div class="input-area">
  <input id="erInput" type="number" step="0.1" placeholder="e.g. 3.5" />
  <button onclick="updateMeter()">Check</button>
</div>


  <div class="meter-container">
    <img src="meter-bg.png" class="meter-bg" />

    <div class="needle-pivot">
  <img src="needle-croc.png" class="needle" id="needle" />
   </div> 

  </div>


  <div id="result"></div>

  <script>
    function updateMeter() {
      const er = parseFloat(document.getElementById("erInput").value);
      const needle = document.getElementById("needle");
      const result = document.getElementById("result");

      if (isNaN(er)) {
        alert("Please enter a number");
        return;
      }

      let angle = -90;
      let label = "Bad";

      if (er < 2) {
        angle = -90;
        label = "Not it yet 🥴";
      } else if (er < 4) {
        angle = -30;
        label = "Good 👍";
      } else if (er < 6) {
        angle = 30;
        label = "Killin it🔥";
      } else {
        angle = 90;
        label = "Above Goal 🐊";
      }

  needle.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;



      result.textContent = `ER ${er}% — ${label}`;
    }
  </script>
</body>
</html>
