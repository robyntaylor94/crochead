<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Croc ER Meter</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ----------------------------
       Base
    ---------------------------- */
    :root {
      --bg: #000;
      --panel: #111;
      --text: #fff;
      --border: #444;
      --lime: #7CFF00;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      font-family: 'Space Grotesk', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Make sure grain sits behind content */
    body > * {
      position: relative;
      z-index: 1;
    }

    /* ----------------------------
       Inputs
    ---------------------------- */
    .input-area {
      margin-bottom: 30px;
    }

    input,
    button,
    select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-family: 'Space Grotesk', Arial, sans-serif;
    }

    select {
      margin-right: 10px;
      cursor: pointer;
    }

    button {
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input::placeholder {
      color: #aaa;
    }

    input:disabled,
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ----------------------------
       Meter layout
    ---------------------------- */
    .meter-container {
      position: relative;
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }

    .meter-bg {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 70vh;
      display: block;
      border: 4px solid var(--lime);
      border-radius: 12px;
      box-shadow:
        0 0 12px rgba(124, 255, 0, 0.8),
        0 0 30px rgba(124, 255, 0, 0.6),
        0 0 60px rgba(124, 255, 0, 0.35),
        0 0 90px rgba(124, 255, 0, 0.2);
    }

    /* Fixed pivot point (center of the dial) */
    .needle-pivot {
      position: absolute;
      left: 50%;
      top: 55%; /* adjust until spiky circle center aligns */
      width: 0;
      height: 0;
    }

    /* Needle image rotates around the spiky circle center */
    .needle {
      position: absolute;
      width: 320px;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%) rotate(-90deg);
      transform-origin: 50% 92%; /* adjust until pivot matches circle center */
      transition: transform 0.8s ease;
      pointer-events: none;
    }
    /* Vibes image button on dial */
.vibes-btn {
  position: absolute;
  top: 20px;
  left: 90px;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  z-index: 10; /* above dial + needle */
}

.vibes-btn img {
  width: 300px;          /* adjust size here */
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  transition: transform 0.15s ease, filter 0.15s ease;
}

.vibes-btn:hover img {
  transform: scale(1.05);
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.75));
}

.vibes-btn:active img {
  transform: scale(0.95);
}


    /* ----------------------------
       Result (delayed reveal)
    ---------------------------- */
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #result.show {
      opacity: 1;
    }

    .microcopy {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.75;
      font-weight: 400;
    }

    /* ----------------------------
       Film grain overlay (background-only)
    ---------------------------- */
    body::before {
      content: "";
      position: fixed;
      inset: -25%;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: screen;
      opacity: 0.55;
      background-size: 70px 70px;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35) 0.6px, transparent 0.7px),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,0.30) 0.6px, transparent 0.7px),
        radial-gradient(circle at 40% 65%, rgba(255,255,255,0.25) 0.6px, transparent 0.7px),
        radial-gradient(circle at 80% 75%, rgba(255,255,255,0.20) 0.6px, transparent 0.7px),
        radial-gradient(circle at 25% 85%, rgba(255,255,255,0.22) 0.6px, transparent 0.7px);
      animation: grain 1.8s steps(6) infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-1%, -1%); }
      20% { transform: translate(1%, 1%); }
      30% { transform: translate(-2%, 1%); }
      40% { transform: translate(2%, -1%); }
      50% { transform: translate(-1%, 2%); }
      60% { transform: translate(1%, -2%); }
      70% { transform: translate(-2%, -1%); }
      80% { transform: translate(1%, 1%); }
      90% { transform: translate(-1%, -2%); }
    }

    /* ----------------------------
       Jibbit rain
    ---------------------------- */
    #jibbitRain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .jibbit {
      position: absolute;
      top: -80px;
      will-change: transform, opacity;
      opacity: 0.95;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.45));
      animation: jibbitFall linear forwards;
    }

    @keyframes jibbitFall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.95; }
      100% { transform: translate3d(var(--drift, 0px), 120vh, 0) rotate(var(--spin, 0deg)); opacity: 0.95; }
    }

    @media (prefers-reduced-motion: reduce) {
      .jibbit { animation: none; }
      body::before { animation: none; }
    }
  </style>
</head>

<body>
  <h1>Enter ER %</h1>

  <div class="input-area">
    <select id="channelSelect">
      <option value="" selected disabled>Select a channel</option>
      <option value="instagram">Instagram</option>
      <option value="tiktok">TikTok</option>
      <option value="facebook">Facebook</option>
      <option value="x">X (Twitter)</option>
      <option value="linkedin">LinkedIn</option>
    </select>

    <input id="erInput" type="number" step="0.1" placeholder="e.g. 6.5" disabled />
    <button id="checkBtn" type="button" disabled>Gauge It</button>

  </div>

  <div class="meter-container">
    <img src="meter-bg.png" class="meter-bg" alt="Croc ER meter" />

<button id="vibesBtn" class="vibes-btn" type="button" aria-label="Play vibes">
  <img src="vibes-icon.png" alt="Vibes" />
</button>



    <div class="needle-pivot">
      <img src="needle-croc.png" class="needle" id="needle" alt="Needle" />
    </div>
  </div>

  <div id="result"></div>
  <div id="jibbitRain" aria-hidden="true"></div>
<audio id="vibesAudio" preload="auto">
  <source src="vibes.mp3" type="audio/mpeg">
</audio>

  <script>
    const channelSelect = document.getElementById("channelSelect");
    const erInput = document.getElementById("erInput");
    const checkBtn = document.getElementById("checkBtn");
    const result = document.getElementById("result");
    const needle = document.getElementById("needle");
const vibesBtn = document.getElementById("vibesBtn");
const vibesAudio = document.getElementById("vibesAudio");

let vibesTimer = null;
let isVibing = false;

function stopVibes() {
  if (vibesTimer) {
    clearTimeout(vibesTimer);
    vibesTimer = null;
  }

  vibesAudio.pause();
  vibesAudio.currentTime = 0;
  isVibing = false;

  // ✅ remove visual "playing" state instead of changing text
  vibesBtn.classList.remove("playing");
}


function startVibes() {
  // Play from the beginning for 20 seconds
  vibesAudio.currentTime = 0;

  vibesAudio.play().then(() => {
    isVibing = true;

    // ✅ instead of changing text (which deletes your image),
    // just toggle a class
    vibesBtn.classList.add("playing");

    vibesTimer = setTimeout(() => {
      stopVibes();
    }, 20000); // 20 seconds
  }).catch(() => {
    isVibing = false;

    // ✅ keep image, remove playing state
    vibesBtn.classList.remove("playing");

    alert("Tap VIBES again to allow audio playback.");
  });
}


    // ER thresholds by channel
    const thresholds = {
      instagram: [2, 4, 6],
      tiktok: [4, 7, 10],
      facebook: [1, 2.5, 4],
      x: [0.5, 1.5, 3],
      linkedin: [1, 2, 3.5]
    };

    // --- Enable inputs only after channel selection ---
    erInput.disabled = true;
    checkBtn.disabled = true;

    channelSelect.addEventListener("change", () => {
      const hasChannel = channelSelect.value !== "";
      erInput.disabled = !hasChannel;
      checkBtn.disabled = !hasChannel;

      result.textContent = "";
      result.classList.remove("show");

      if (hasChannel) erInput.focus();
    });

    // Allow Enter key to trigger gauge
    erInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !checkBtn.disabled) updateMeter();
    });

    checkBtn.addEventListener("click", updateMeter);

    // --- Jibbit rain ---
    let jibbitInterval = null;

    function startJibbitRain(durationMs = 2200) {
      const rain = document.getElementById("jibbitRain");
      if (!rain) return;

      stopJibbitRain();
      const start = Date.now();

      jibbitInterval = setInterval(() => {
        if (Date.now() - start > durationMs) {
          stopJibbitRain();
          return;
        }

        const count = Math.floor(Math.random() * 3) + 2; // 2–4
        for (let i = 0; i < count; i++) {
          const img = document.createElement("img");
          img.src = "jibbit.png"; // make sure filename matches exactly
          img.className = "jibbit";

          const size = Math.floor(Math.random() * 100) + 70; // 70–170px
          img.style.width = `${size}px`;
          img.style.height = "auto";

          img.style.left = `${Math.random() * 100}vw`;

          const drift = (Math.random() * 120 - 60).toFixed(0);
          const spin = (Math.random() * 360 - 180).toFixed(0);
          img.style.setProperty("--drift", `${drift}px`);
          img.style.setProperty("--spin", `${spin}deg`);

          const fallDuration = (Math.random() * 1.2 + 1.6).toFixed(2);
          img.style.animationDuration = `${fallDuration}s`;

          img.addEventListener("animationend", () => img.remove());
          rain.appendChild(img);
        }
      }, 180);
    }

    function stopJibbitRain() {
      if (jibbitInterval) {
        clearInterval(jibbitInterval);
        jibbitInterval = null;
      }
      const rain = document.getElementById("jibbitRain");
      if (rain) rain.innerHTML = "";
    }

    // --- Main meter update ---
    function updateMeter() {
      const channel = channelSelect.value;
      const er = parseFloat(erInput.value);

      if (!channel) {
        alert("Please select a channel first");
        return;
      }

      if (Number.isNaN(er)) {
        alert("Please enter an ER number");
        return;
      }

      stopJibbitRain();

      const [badMax, goodMax, betterMax] = thresholds[channel];

      let angle = -90;
      let label = "Close but no 🥴";
      let microCopy = "Oof. This croc stayed dormant.";

      if (er < badMax) {
        angle = -90;
        label = "Close but no 🥴";
        microCopy = "Oof. This croc stayed dormant.";
      } else if (er < goodMax) {
        angle = -30;
        label = "Good 👍";
        microCopy = "A solid splash.";
      } else if (er < betterMax) {
        angle = 30;
        label = "Better 🔥";
        microCopy = "Now we’re really snapping.";
      } else {
        angle = 90;
        label = "Killin’ It 🐊";
        microCopy = "Big bite energy.";
        startJibbitRain(2600);
      }

      // Move needle
      needle.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

      // Channel label (human readable)
      const channelLabel = channelSelect.options[channelSelect.selectedIndex].text;

      // Delayed reveal
      result.classList.remove("show");

      setTimeout(() => {
        result.innerHTML = `
          <div>${channelLabel} ER ${er}% — ${label}</div>
          <div class="microcopy">${microCopy}</div>
        `;
        result.classList.add("show");
      }, 500);
    }
  </script>
</body>
</html>
