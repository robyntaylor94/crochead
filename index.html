

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Croc ER Meter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
   body {
  margin: 0;
  font-family: 'Space Grotesk', Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;
  background: #000;
  color: #fff;
} 
.input-area {
  margin-bottom: 30px; /* increase if you want more space */
}
input:disabled, button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

select {
  cursor: pointer;
}





    /* This is the fixed pivot point (center of the dial) */
/* Fixed pivot point (dial center) */
.needle-pivot {
  position: absolute;
  left: 50%;
  top: 55%;         /* <-- adjust this up/down until the circle sits on dial center */
  width: 0;
  height: 0;
}

/* Needle image rotates around the spiky circle center */
.needle {
  position: absolute;
  width: 320px;     /* tweak size */
  left: 0;
  top: 0;

  /* These two are the KEY:
     Put the spiky-circle center on the pivot point */
  transform: translate(-50%, -50%) rotate(-90deg);

  /* Set origin to the circle center INSIDE the image */
  transform-origin: 50% 92%;  /* <-- tweak this to match the circle's center */

  transition: transform 0.8s ease;
  pointer-events: none;
}

#result {
  opacity: 0;
  transition: opacity 0.3s ease;
}

#result.show {
  opacity: 1;
}


    input {
      padding: 10px;
      font-size: 16px;
      width: 100px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif; /* match h1 */
  letter-spacing: 0.06em;
  text-transform: uppercase;
}


    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    

input, button {
  background: #111;
  color: #fff;
  border: 1px solid #444;

  padding: 12px 18px;
  border-radius: 12px;   /* ← this rounds them */
  font-size: 16px;
  
}
select {
  background: #111;
  color: #fff;
  border: 1px solid #444;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 16px;
  margin-right: 10px;
}


input::placeholder {
  color: #aaa;
}


.meter-container {
  position: relative;
  width: 100%;
  margin: 0 auto;
  display: flex;
  justify-content: center;
}


.meter-bg {
  width: auto;          /* don't force it wider than its natural size */
  height: auto;         /* keep aspect ratio */
  max-width: 100%;      /* still responsive on small screens */
  max-height: 70vh;     /* keep it from taking over vertically */
  display: block;
  image-rendering: auto;
  border: 4px solid #7CFF00;   /* lime green */
  border-radius: 12px;         /* optional: slight rounding */
 
  box-shadow:
  0 0 12px rgba(124, 255, 0, 0.8),
  0 0 30px rgba(124, 255, 0, 0.6),
  0 0 60px rgba(124, 255, 0, 0.35),
  0 0 90px rgba(124, 255, 0, 0.2);

}
/* OBVIOUS film grain overlay (background-only) */
body::before {
  content: "";
  position: fixed;
  inset: -25%;

  /* White-biased film grain */
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35) 0.6px, transparent 0.7px),
    radial-gradient(circle at 70% 30%, rgba(255,255,255,0.30) 0.6px, transparent 0.7px),
    radial-gradient(circle at 40% 65%, rgba(255,255,255,0.25) 0.6px, transparent 0.7px),
    radial-gradient(circle at 80% 75%, rgba(255,255,255,0.20) 0.6px, transparent 0.7px),
    radial-gradient(circle at 25% 85%, rgba(255,255,255,0.22) 0.6px, transparent 0.7px);

  background-size: 70px 70px;     /* dense grain */
  opacity: 0.55;                  /* visible but not snowy */
  mix-blend-mode: screen;         /* KEY for black backgrounds */
  pointer-events: none;
  z-index: 0;

  animation: grain 1.8s steps(6) infinite;
}


body > * {
  position: relative;
  z-index: 1;
}

@keyframes grain {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(-1%, -1%); }
  20% { transform: translate(1%, 1%); }
  30% { transform: translate(-2%, 1%); }
  40% { transform: translate(2%, -1%); }
  50% { transform: translate(-1%, 2%); }
  60% { transform: translate(1%, -2%); }
  70% { transform: translate(-2%, -1%); }
  80% { transform: translate(1%, 1%); }
  90% { transform: translate(-1%, -2%); }
}
/* Jibbit rain container (covers whole screen) */
#jibbitRain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999; /* above everything */
  overflow: hidden;
}

/* Each falling jibbit */
.jibbit {
  position: absolute;
  top: -80px; /* start above the viewport */
  will-change: transform, opacity;
  opacity: 0.95;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,0.45));
  animation: jibbitFall linear forwards;
}

/* Falling animation */
@keyframes jibbitFall {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg);
    opacity: 0.0;
  }
  10% {
    opacity: 0.95;
  }
  100% {
    transform: translate3d(var(--drift, 0px), 120vh, 0) rotate(var(--spin, 0deg));
    opacity: 0.95;
  }
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  .jibbit { animation: none; }
}




  </style>
</head>

<body>
 <h1>Enter ER %</h1>

<div class="input-area">
  <select id="channelSelect">
    <option value="" selected disabled>Select a channel</option>
    <option value="instagram">Instagram</option>
    <option value="tiktok">TikTok</option>
    <option value="facebook">Facebook</option>
    <option value="x">X (Twitter)</option>
    <option value="linkedin">LinkedIn</option>
  </select>

  <input id="erInput" type="number" step="0.1" placeholder="e.g. 3.5" disabled />
<button id="checkBtn" onclick="updateMeter()" disabled>Gauge It</button>
</div>



  <div class="meter-container">
    <img src="meter-bg.png" class="meter-bg" />

    <div class="needle-pivot">
  <img src="needle-croc.png" class="needle" id="needle" />
   </div> 

  </div>


  <div id="result"></div>
  <div id="jibbitRain" aria-hidden="true"></div>
  <!--script is last object in body-->
<script>
    const channelSelect = document.getElementById("channelSelect");
    const erInput = document.getElementById("erInput");
    const checkBtn = document.getElementById("checkBtn");
    const result = document.getElementById("result");

    // Start disabled (in case HTML didn't load as expected)
    erInput.disabled = true;
    checkBtn.disabled = true;

    channelSelect.addEventListener("change", () => {
      const hasChannel = channelSelect.value !== "";
      erInput.disabled = !hasChannel;
      checkBtn.disabled = !hasChannel;

      // Optional: clear previous result when switching channels
      result.textContent = "";

      if (hasChannel) erInput.focus();
    });
let jibbitInterval = null;

function startJibbitRain(durationMs = 2200) {
  const rain = document.getElementById("jibbitRain");
  if (!rain) return;

  // Clear any existing burst
  stopJibbitRain();

  const start = Date.now();

  jibbitInterval = setInterval(() => {
    // Stop after duration
    if (Date.now() - start > durationMs) {
      stopJibbitRain();
      return;
    }

    // Create 2–4 jibbits per tick
    const count = Math.floor(Math.random() * 3) + 2;

    for (let i = 0; i < count; i++) {
      const img = document.createElement("img");
      img.src = "jibbit.png"; // <-- make sure filename matches your repo
      img.className = "jibbit";

      // Random size (px)
      const size = Math.floor(Math.random() * 60) + 28; // 28–88px
      img.style.width = `${size}px`;
      img.style.height = "auto";

      // Random x position
      img.style.left = `${Math.random() * 100}vw`;

      // Random drift + spin via CSS variables
      const drift = (Math.random() * 120 - 60).toFixed(0); // -60..60px
      const spin = (Math.random() * 360 - 180).toFixed(0); // -180..180deg
      img.style.setProperty("--drift", `${drift}px`);
      img.style.setProperty("--spin", `${spin}deg`);

      // Random duration so they don’t fall uniformly
      const fallDuration = (Math.random() * 1.2 + 1.6).toFixed(2); // 1.6–2.8s
      img.style.animationDuration = `${fallDuration}s`;

      // Remove after animation completes
      img.addEventListener("animationend", () => img.remove());

      rain.appendChild(img);
    }
  }, 180); // frequency of spawns
}

function stopJibbitRain() {
  if (jibbitInterval) {
    clearInterval(jibbitInterval);
    jibbitInterval = null;
  }
  const rain = document.getElementById("jibbitRain");
  if (rain) rain.innerHTML = "";
}

    function updateMeter() {
      const channel = document.getElementById("channelSelect").value;
      const er = parseFloat(document.getElementById("erInput").value);
      const needle = document.getElementById("needle");
      const result = document.getElementById("result");

      if (!channel) {
        alert("Please select a channel first");
        return;
      }

      if (isNaN(er)) {
        alert("Please enter an ER number");
        return;
      }

      // ER thresholds by channel
      const thresholds = {
        instagram: [2, 4, 6],
        tiktok: [4, 7, 10],
        facebook: [1, 2.5, 4],
        x: [0.5, 1.5, 3],
        linkedin: [1, 2, 3.5]
      };

      const [badMax, goodMax, betterMax] = thresholds[channel];

      let angle = -90;
      let label = "Bad 🥴";
      let microCopy = "";
      stopJibbitRain();

      if (er < badMax) {
        angle = -90;
        label = "Close but no 🥴";
        microCopy = "Oof. This croc stayed dormant.";
      } else if (er < goodMax) {
        angle = -30;
        label = "Good 👍";
        microCopy = "A solid splash.";
      } else if (er < betterMax) {
        angle = 30;
        label = "Better🔥";
        microCopy = "Now we’re really snapping.";
      } else {
        angle = 90;
        label = "Killin It 🐊";
        microCopy = "Big bite energy.";
        startJibbitRain(2600);
      }

      needle.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

      const channelLabel =
        document.querySelector(`#channelSelect option[value="${channel}"]`).textContent;

    // Hide result immediately
    result.classList.remove("show");

    // Delay reveal for dramatic effect
    setTimeout(() => {
      result.innerHTML = `
        <div>${channelLabel} ER ${er}% — ${label}</div>
        <div style="margin-top:6px; font-size:14px; opacity:0.75;">
          ${microCopy}
        </div>
      `;
      result.classList.add("show");
    }, 500);

    }
  </script>
</body>
</html>
