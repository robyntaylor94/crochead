<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Croc ER Meter</title>
  <style>
   body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;
  background: #000;
  color: #fff;
}




    .needle {
  position: absolute;
  width: 220px;             /* adjust if needed */
  left: 50%;
  top: 65%;                 /* anchor around the dial center area */
  transform-origin: 12% 50%; /* pivot closer to the left */
  transform: translate(-50%, -50%) rotate(-90deg);
  transition: transform 0.8s ease;
}


    input {
      padding: 10px;
      font-size: 16px;
      width: 100px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    

input, button {
  background: #111;
  color: #fff;
  border: 1px solid #444;
}

input::placeholder {
  color: #aaa;
}


.meter-container {
  position: relative;
  width: 100%;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  box-shadow: 0 0 20px rgba(124, 255, 0, 0.35);
}


.meter-bg {
  width: auto;          /* don't force it wider than its natural size */
  height: auto;         /* keep aspect ratio */
  max-width: 100%;      /* still responsive on small screens */
  max-height: 70vh;     /* keep it from taking over vertically */
  display: block;
  image-rendering: auto;
  border: 4px solid #7CFF00;   /* lime green */
  border-radius: 12px;         /* optional: slight rounding */
}



  </style>
</head>

<body>
  <h1>Enter ER %</h1>

  <input id="erInput" type="number" step="0.1" placeholder="e.g. 3.5" />
  <button onclick="updateMeter()">Check</button>

  <div class="meter-container">
    <img src="meter-bg.png" class="meter-bg" />
    <img src="needle-croc.png" class="needle" id="needle" />
  </div>


  <div id="result"></div>

  <script>
    function updateMeter() {
      const er = parseFloat(document.getElementById("erInput").value);
      const needle = document.getElementById("needle");
      const result = document.getElementById("result");

      if (isNaN(er)) {
        alert("Please enter a number");
        return;
      }

      let angle = -90;
      let label = "Bad";

      if (er < 2) {
        angle = -90;
        label = "Bad 🥴";
      } else if (er < 4) {
        angle = -30;
        label = "Good 👍";
      } else if (er < 6) {
        angle = 30;
        label = "Better 😎";
      } else {
        angle = 90;
        label = "Above Goal 🐊🔥";
      }

     needle.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

      result.textContent = `ER ${er}% — ${label}`;
    }
  </script>
</body>
</html>
